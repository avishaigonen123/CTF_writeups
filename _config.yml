title: Avishai's CTF Writeups
description: "Yalla Balagan! A collection of my CTF writeups and solutions."
url: "https://avishaigonen123.github.io"
baseurl: "/CTF_writeups"  
remote_theme: pages-themes/hacker
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  input: GFM
  auto_ids: true
  toc: true
  toc_levels: 1..3

  
# Only plugins on the GitHub Pages whitelist are listed. Four entries were
# removed that were never going to run - jekyll-copy-button, jekyll-twitter-cards,
# jekyll-tags and jekyll-social-share-buttons are not in the whitelist, so Pages
# ignored them silently. Listing them only made the config claim features the
# site does not have. Adding any of them back would require building the site
# elsewhere and pushing the output.
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from


# Removed: a `seo:` block and a `categories:` list. Neither was consumed by
# anything - jekyll-seo-tag reads the top-level title/description/url above, and
# the plugin that would have read `categories:` is not on the GitHub Pages
# whitelist. They only made the config look like it configured something.

# Removed: paginate / paginate_path. jekyll-paginate only paginates _posts,
# and this site has no _posts directory, so it emitted a build warning
# ("Pagination is enabled, but I couldn't find an index.html page to use as the
# pagination template") and generated nothing.

# include: only rescues paths Jekyll would otherwise skip, i.e. ones whose name
# starts with "." or "_". It does NOT control what gets published: websec.il,
# stuff and utils are all absent from this list and all publish fine. The list
# below is therefore belt-and-braces for ordinary directories, and the toctf /
# pwnable.tw entries that pointed at directories which do not exist are gone.
include:
  - overthewire
  - pwnable.kr
  - ringzer0
  - hackthebox
  - tryhackme
  - webhacking.kr
  - lord-of-sql-injection
  - trythis0ne
  - AppSec-IL-2025
  - websec.fr
  - root-me
  - flare-on
  - hacker101
  - android_hacking
  - websec.il
  - assets/

  - assets/  
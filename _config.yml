title: Avishai's CTF Writeups
description: "Yalla Balagan! A collection of my CTF writeups and solutions."
url: "https://avishaigonen123.github.io"
baseurl: "/CTF_writeups"  
remote_theme: pages-themes/hacker
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  input: GFM
  auto_ids: true
  toc: true
  toc_levels: 1..3

  
# Only plugins on the GitHub Pages whitelist are listed. Four entries were
# removed that were never going to run - jekyll-copy-button, jekyll-twitter-cards,
# jekyll-tags and jekyll-social-share-buttons are not in the whitelist, so Pages
# ignored them silently. Listing them only made the config claim features the
# site does not have. Adding any of them back would require building the site
# elsewhere and pushing the output.
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from


# SEO Configuration
seo:
  description: "Avishai's CTF Writeups - A collection of writeups, challenges, and solutions from CTFs."
  keywords:
    - "CTF"
    - "writeups"
    - "security"
    - "hacking"
  image: "/favicon.ico" # Set a default image for social media

# Define categories in your _config.yml
categories:
  - "Web Exploitation"
  - "Crypto"
  - "Binary Exploitation"
  

paginate: 10
paginate_path: "/page:num/"

# 🧠 ADD THIS SECTION 👇
include:
  - overthewire
  - pwnable.kr
  - ringzer0
  - pwnable.tw
  - hackthebox
  - tryhackme
  - picoctf
  - webhacking.kr
  - lord-of-sql-injection
  - trythis0ne
  - AppSec-IL-2025
  - websec.fr
  - root-me
  - flare-on
  - hacker101
  - android_hacking

  - assets/  